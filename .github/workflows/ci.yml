name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-api:
    name: admin-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The suites import PyJWT; everything else they touch is stdlib or one of
      # the *_double.py fakes checked in beside them. Pinned to the version the
      # server's venv runs.
      - run: pip install PyJWT==2.13.0

      - name: admin-api suites
        working-directory: deploy/admin-api
        run: |
          failed=()
          for f in test_*.py; do
            echo "::group::$f"
            python3 "$f" || { failed+=("$f"); echo "::error file=deploy/admin-api/$f::$f failed"; }
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi

      - name: api-gateway and contact-relay suites
        run: |
          failed=()
          for f in deploy/api-gateway/test_*.py deploy/contact-relay/test_*.py; do
            echo "::group::$f"
            (cd "$(dirname "$f")" && python3 "$(basename "$f")") || { failed+=("$f"); echo "::error file=$f::$f failed"; }
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi
