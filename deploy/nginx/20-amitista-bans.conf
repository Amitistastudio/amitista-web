# Application-level ban list, applied at http level so every server and every
# location inherits it.
#
# WHY THIS EXISTS RATHER THAN JUST fail2ban's iptables ban:
#
# With Cloudflare in front of the domain, an attacker's packets no longer
# arrive from the attacker's address — they arrive from a Cloudflare edge
# address. fail2ban's `iptables-multiport` banaction inserts a DROP for the
# address the filter extracted, which after real-IP restoration is the
# attacker's true address. That address never appears as a packet source on
# this box for proxied traffic, so the iptables rule matches nothing and the
# ban is silently a no-op.
#
# nginx `deny`, by contrast, is evaluated against $remote_addr, which
# 10-cloudflare-realip.conf has already rewritten to the true client address.
# So this is the half of the ban that actually bites on proxied traffic.
#
# The iptables ban is deliberately kept as well: anything reaching the origin
# directly — by IP, or via a hostname that is not proxied — is still a real
# packet from a real source, and dropping it at the firewall is cheaper than
# letting it reach nginx.
#
# Inheritance note: ngx_http_access_module directives are inherited downward
# only while no allow/deny is defined at the inner level. There are currently
# no allow/deny directives in the site config, so this applies everywhere. If
# amitista-admin-allow.conf is ever wired into a location, that location stops
# inheriting these bans and needs its own include of the list.

include /etc/nginx/snippets/amitista-bans.list;
