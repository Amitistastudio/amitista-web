[amitista-admin]
enabled = true
filter = amitista-admin
backend = systemd
port = http,https
maxretry = 4
findtime = 10m

# Two ban layers, on purpose. %(action_)s is the firewall ban and still catches
# anything that reaches the origin directly; amitista-nginx-deny is the one
# that works for traffic arriving through Cloudflare, where the attacker's
# address is not the packet source. Dropping either one leaves a hole.
action = %(action_)s
         amitista-nginx-deny
