# Cloudflare real-IP restoration.
#
# WHY THIS EXISTS, AND WHY IT IS SAFE TO HAVE HERE BEFORE CLOUDFLARE IS LIVE:
#
# `set_real_ip_from` only trusts the CF-Connecting-IP header when the *peer*
# address — the machine actually holding the TCP connection — is inside one of
# the ranges below. A stranger connecting straight to the origin address and
# sending a forged CF-Connecting-IP header is not in these ranges, so nginx ignores the
# header entirely. Until the domain is proxied through Cloudflare this file is
# a no-op; it never widens trust on its own.
#
# It has to be in place BEFORE Cloudflare is switched on, though, not after.
# The site's rate limits key on $binary_remote_addr (see nginx.conf lines
# 80-92) and `limit_conn amitista_conn 50` caps concurrent connections per key.
# With Cloudflare in front and no real_ip restoration, every visitor on earth
# collapses into ~15 Cloudflare source addresses, blows through the 50-
# connection cap, and the site rate-limits itself into a 503. This file is what
# keeps the limits — and the access log, and any future fail2ban nginx jail —
# operating on the actual client address.
#
# Ranges fetched from https://www.cloudflare.com/ips-v4 and /ips-v6 on
# 2 August 2026. Cloudflare changes these rarely but does change them; re-pull
# both lists if proxied traffic ever starts getting the wrong client IP.

# --- IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP carries a single address and cannot be appended to by an
# upstream hop, which is why it is preferred here over X-Forwarded-For.
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
