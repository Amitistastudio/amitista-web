# Ban at the nginx layer instead of (in addition to) the firewall layer.
#
# Needed because the site is behind Cloudflare: for proxied traffic the
# attacker's address is never a packet source on this box, so an iptables DROP
# on it matches nothing. nginx `deny` is evaluated against the real-IP-restored
# $remote_addr and does bite. See /etc/nginx/conf.d/20-amitista-bans.conf.

[Definition]

actionstart =
actionstop  = /usr/local/sbin/amitista-nginx-ban.sh flush
actioncheck =
actionban   = /usr/local/sbin/amitista-nginx-ban.sh add <ip>
actionunban = /usr/local/sbin/amitista-nginx-ban.sh del <ip>
