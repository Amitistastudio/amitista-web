# The empty ruleset. Installed before the panel has staged anything, and by
# firewall-off.sh as the recovery path. Every variable the site snippet reads is
# declared here, so nginx starts whether or not a rule exists.

geo $amitista_fw_ip {
    default 0;
}

map $uri $amitista_fw_path {
    default 0;
}

map $request_uri $amitista_fw_uri {
    default 0;
}

map $http_user_agent $amitista_fw_agent {
    default 0;
}

map $request_method $amitista_fw_method {
    default 0;
}

map "$amitista_fw_ip$amitista_fw_path$amitista_fw_uri$amitista_fw_agent$amitista_fw_method" $amitista_fw {
    "~1"    block;
    "~2"    watch;
    default pass;
}

map $amitista_fw $amitista_fw_log {
    pass    0;
    default 1;
}

log_format amitista_fw '$remote_addr $amitista_fw_ip$amitista_fw_path$amitista_fw_uri$amitista_fw_agent$amitista_fw_method $amitista_fw [$time_local] "$request_method $request_uri" $status "$http_user_agent"';
