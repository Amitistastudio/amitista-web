server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/default-deny.crt;
    ssl_certificate_key /etc/nginx/ssl/default-deny.key;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name amitista.com www.amitista.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://amitista.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.amitista.com;

    ssl_certificate     /etc/letsencrypt/live/amitista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amitista.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://amitista.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amitista.com;

    root /var/www/amitista.com/current;
    index index.html;

    merge_slashes on;

    set $csp_style_hash "";
    set $corp "same-origin";

    include /etc/nginx/snippets/amitista-preload-links.conf;

    ssl_certificate     /etc/letsencrypt/live/amitista.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amitista.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_buffer_size 4k;

    access_log /var/log/nginx/amitista.access.log;
    error_log  /var/log/nginx/amitista.error.log;

    include /etc/nginx/snippets/amitista-security-headers.conf;
    include /etc/nginx/snippets/amitista-firewall.conf;

    limit_req  zone=amitista_req burst=100 nodelay;
    limit_conn amitista_conn 50;

    proxy_hide_header X-Powered-By;

    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;

    keepalive_timeout 30s;

    client_max_body_size      64k;
    large_client_header_buffers 4 8k;

    gzip_static on;

    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    open_file_cache          max=1000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    location = /api/contact {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;

        limit_except POST { deny all; }
        limit_req zone=amitista_contact burst=3 nodelay;

        client_max_body_size 16k;
        client_body_buffer_size 16k;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/apply {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;

        limit_except POST { deny all; }
        limit_req zone=amitista_apply burst=2 nodelay;

        client_max_body_size 32k;
        client_body_buffer_size 32k;

        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/amitista-apply-auth.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/ask {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;

        limit_except POST { deny all; }
        limit_req zone=amitista_ask burst=2 nodelay;

        client_max_body_size 4k;
        client_body_buffer_size 4k;

        proxy_pass http://127.0.0.1:8797;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /csp-report {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;

        limit_except POST { deny all; }
        limit_req zone=amitista_csp burst=5 nodelay;

        client_max_body_size 16k;
        client_body_buffer_size 16k;

        access_log /var/log/nginx/amitista.csp.log amitista_csp;

        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /api/admin/login {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except POST { deny all; }
        limit_req zone=amitista_admin burst=5 nodelay;

        client_max_body_size 4k;
        client_body_buffer_size 4k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/admin/boards/art {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET POST { deny all; }
        limit_req zone=amitista_admin_read burst=60 nodelay;

        client_max_body_size 1m;
        client_body_buffer_size 128k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/admin/boards/cards/file {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET POST { deny all; }
        limit_req zone=amitista_admin_read burst=60 nodelay;

        client_max_body_size 6m;
        client_body_buffer_size 128k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /api/admin/account/picture {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET POST { deny all; }
        limit_req zone=amitista_admin_read burst=60 nodelay;

        client_max_body_size 1m;
        client_body_buffer_size 128k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/admin/users/picture {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET { deny all; }
        limit_req zone=amitista_admin_read burst=60 nodelay;

        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /api/admin/boards/face {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET { deny all; }
        limit_req zone=amitista_admin_read burst=90 nodelay;

        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/admin/ {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET POST { deny all; }
        limit_req zone=amitista_admin_read burst=30 nodelay;

        client_max_body_size 4k;
        client_body_buffer_size 4k;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/k/ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET HEAD { deny all; }
        limit_req zone=amitista_gateway burst=20 nodelay;

        client_max_body_size 1k;
        client_body_buffer_size 1k;

        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        proxy_hide_header Cache-Control;
        proxy_hide_header X-Powered-By;
    }

    location = /admin {
        error_page 403 =404 /404.html;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_except GET HEAD { deny all; }
        limit_req zone=amitista_admin_page burst=10 nodelay;

        try_files /routes/admin.html /index.html;
    }

    location = /api/status {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=240" always;

        alias /var/www/amitista.com/shared/status.json;
        default_type application/json;
        limit_except GET HEAD { deny all; }
        try_files "" =404;
    }

    location = /api/maintenance {
        include /etc/nginx/snippets/amitista-security-headers.conf;

        limit_except GET { deny all; }
        error_page 502 504 =503 @api_unavailable;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /api/v1 {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;
        include /etc/nginx/snippets/amitista-api-token.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/status {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;
        include /etc/nginx/snippets/amitista-api-token.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/shield/brands {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;
        add_header Cache-Control "public, max-age=120" always;

        alias /var/www/amitista.com/shared/shield-brands.json;
        limit_except GET HEAD { deny all; }
        try_files "" =404;
    }

    location = /api/v1/exchange/fees {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;
        add_header Cache-Control "public, max-age=300" always;

        alias /var/www/amitista.com/shared/exchange/fees.json;
        limit_except GET HEAD { deny all; }
        try_files "" =404;
    }

    location = /api/v1/shield/feed {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;

        limit_req zone=amitista_feed burst=20 nodelay;
        error_page 502 504 =503 @api_unavailable;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /api/v1/shield/rules {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;
        include /etc/nginx/snippets/amitista-api-token.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /api/v1/shield/feed/status {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;

        limit_req zone=amitista_feed burst=20 nodelay;
        error_page 502 504 =503 @api_unavailable;

        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ^~ /api/v1/ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        include /etc/nginx/snippets/amitista-api-cors.conf;
        include /etc/nginx/snippets/amitista-api-token.conf;
        add_header Cache-Control "no-store" always;
    }

    location @api_404 {
        include /etc/nginx/snippets/amitista-api-cors.conf;
        add_header Cache-Control "no-store" always;
        return 404 '{"error":"No such endpoint in this version.","version":"v1","index":"https://amitista.com/api/v1","documentation":"https://amitista.com/api"}\n';
    }

    location @api_unavailable {
        include /etc/nginx/snippets/amitista-api-cors.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        return 503 '{"error":"This endpoint is served by a component that is not answering right now. Installs fail open and keep the ruleset they hold.","version":"v1","index":"https://amitista.com/api/v1","documentation":"https://amitista.com/api"}\n';
    }

    location /assets/ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /img/ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        location ~ \.avif$ {
            include /etc/nginx/snippets/amitista-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            default_type image/avif;
            try_files $uri =404;
        }
    }

    location ~* ^/(work|team|partners)/.+\.(webp|avif|png|jpe?g|gif|svg)$ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        try_files $uri =404;
    }

    location ~* ^/(favicon\.png|apple-touch-icon\.png|og\.png|amitista-logo\.png)$ {
        set $corp "cross-origin";
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=2592000" always;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location = /speculation-rules.json {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        types { }
        default_type application/speculationrules+json;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/amitista-csp-style-hash.conf;

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Link $preload_links_home always;
        add_header Speculation-Rules "\"/speculation-rules.json\"" always;
        try_files /home.html /index.html;
    }

    location / {
        if ($uri ~ "^(/.*[^/])/+$") {
            return 301 $1$is_args$args;
        }

        if (!-d $document_root/routes) {
            rewrite ^ /index.html break;
        }

        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Link $preload_links always;
        add_header Speculation-Rules "\"/speculation-rules.json\"" always;

        try_files $uri /routes$uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/amitista-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Link $preload_links always;
    }

    location ~* \.(bak|backup|old|orig|original|save|swp|swo|swn|tmp|temp|rej|dist|log|sql|sqlite|db|env|ini|cfg|conf|config|yml|yaml|toml|key|pem|crt|p12|pfx|sh|bash|zip|tar|tgz|rar|7z)$ {
        return 404;
    }

    location ~* (~|#)$ {
        return 404;
    }

    location ~* ^/(env|environment|config|secrets|credentials)(\.[^/.]*)*/?$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}

server {
    listen 127.0.0.1:8095;

    server_name _;

    access_log off;

    location / {
        return 204;
    }
}
